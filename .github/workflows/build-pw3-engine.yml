name: build-pw3-engine

# Builds a PW3-compatible package WITH the Pikafish engine bundled.
# Pikafish is cross-built static with the koxtoolchain kindlepw2 toolchain so
# it runs on the 3.0.35 kernel; the GTK app is built in the Jessie container
# as before. Run from the Actions tab and download the artifact.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with Pikafish submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Pikafish (static, kindlepw2) -> bin/armhf
        run: |
          chmod +x build_pikafish_pw3.sh
          ./build_pikafish_pw3.sh

      - name: Enable ARM emulation (for the GTK app build)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Build the Jessie (old-glibc) ARM image
        run: |
          docker build \
            --platform linux/arm/v7 \
            -t exact-chinesechess-armhf-build:jessie \
            -f docker/Dockerfile.armhf-jessie \
            docker

      - name: Start a persistent builder container
        run: |
          docker run -d \
            --platform linux/arm/v7 \
            --name exact-chinesechess-armhf-builder \
            -v "$PWD":/src/exact-chinesechess \
            -w /src/exact-chinesechess \
            exact-chinesechess-armhf-build:jessie \
            sleep infinity

      - name: Compile the app and run the smoke test
        run: |
          docker exec exact-chinesechess-armhf-builder /bin/bash -lc \
            "make clean && make exact-chinesechess smoke-test && ./smoke-test"

      - name: Show baked-in minimum kernel for app and engine
        run: |
          echo "--- app ---"
          docker exec exact-chinesechess-armhf-builder /bin/bash -lc "file exact-chinesechess"
          echo "--- pikafish (expect: statically linked, for GNU/Linux 2.6.x) ---"
          file bin/armhf/pikafish

      - name: Package the extension (app + Pikafish + NNUE)
        env:
          EXACT_CHINESECHESS_DOCKER_CONTAINER: exact-chinesechess-armhf-builder
        run: ./package_extension.sh

      - name: Upload the installable zip
        uses: actions/upload-artifact@v4
        with:
          name: exact-chinesechess-pw3-pikafish
          path: |
            release/exact-chinesechess-extension.zip
            release/SHA256SUMS
